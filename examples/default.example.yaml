# Copy outside Git, fill private values, then restrict access to the owner.
workspace:
  root: ./work
reports:
  root: ./reports
  sections: [requirements, scenarios, findings, interpretations, diagnostics]
execution:
  # Use virtual for booted Android emulators and iOS simulators.
  device-kind: physical
  # Optional device-ids list restricts the startup snapshot.
  time-limit-minutes: 60
  interactive-pauses: false
ai-model:
  name: "<configured-model>"
  api-key: ""
ai-budget:
  amount: 5
  currency: USD
